<body class="invito-page">

<!-- =========== simboli usati da questa pagina =========== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- triquetra: tre lenti d'arco intrecciate, un filo senza fine.
         L'intreccio si fa a maschera: un forellino nel filo che passa
         sotto, così funziona su qualsiasi sfondo. Tenerlo uguale a
         index.html. -->
    <symbol id="sym-triquetra" viewBox="0 0 120 120">
      <defs>
        <mask id="tq-m0" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="#fff"/><circle cx="60" cy="49.8" r="4.2" fill="#000"/></mask>
        <mask id="tq-m1" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="#fff"/><circle cx="68.8" cy="65.1" r="4.2" fill="#000"/></mask>
        <mask id="tq-m2" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="#fff"/><circle cx="51.1" cy="65.1" r="4.2" fill="#000"/></mask>
      </defs>
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
        <path d="M60 22 A44 44 0 0 1 92.9 79 A44 44 0 0 1 60 22 Z" mask="url(#tq-m0)"/>
        <path d="M92.9 79 A44 44 0 0 1 27.1 79 A44 44 0 0 1 92.9 79 Z" mask="url(#tq-m1)"/>
        <path d="M27.1 79 A44 44 0 0 1 60 22 A44 44 0 0 1 27.1 79 Z" mask="url(#tq-m2)"/>
      </g>
    </symbol>

    <!-- claddagh: due mani reggono un cuore coronato -->
    <symbol id="sym-claddagh" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M42 40 L 46 26 L 53 34 L 60 20 L 67 34 L 74 26 L 78 40 Z"/>
        <circle cx="46" cy="22" r="2.6"/><circle cx="60" cy="16" r="2.6"/><circle cx="74" cy="22" r="2.6"/>
        <path d="M60 90 C 44 76 38 66 42 57 C 46 49 56 50 60 58 C 64 50 74 49 78 57 C 82 66 76 76 60 90 Z"/>
        <g id="claddagh-hand">
          <path d="M22 92 C 16 76 20 58 34 52 C 39 50 43 53 42 58"/>
          <path d="M36 55 C 40 51 45 52 46 57"/>
          <path d="M32 62 C 36 58 41 59 42 64"/>
          <path d="M30 70 C 34 66 39 67 40 72"/>
        </g>
        <use href="#claddagh-hand" transform="translate(120 0) scale(-1 1)"/>
      </g>
    </symbol>

    <!-- nodo dell'amore: quattro anse intrecciate -->
    <symbol id="sym-lovers" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
        <path d="M60 26 A34 34 0 0 1 94 60 A34 34 0 0 1 60 26 Z"/>
        <path d="M94 60 A34 34 0 0 1 60 94 A34 34 0 0 1 94 60 Z"/>
        <path d="M60 94 A34 34 0 0 1 26 60 A34 34 0 0 1 60 94 Z"/>
        <path d="M26 60 A34 34 0 0 1 60 26 A34 34 0 0 1 26 60 Z"/>
      </g>
    </symbol>

    <!-- ======================= trifoglio =======================
         Una sola foglia (#lf) ruotata di 120° e 240° attorno a (60,54).
         La foglia sta dentro il suo spicchio: tre copie si toccano senza
         accavallarsi. #clover-mark è il gruppo nudo, senza spessore
         imposto: si posiziona con transform e riceve lo stroke-width da
         chi lo usa, così resta coerente a qualsiasi scala.
         ========================================================= -->
    <path id="lf" d="M60 54 C 54.5 50.5 46.5 46.5 42.5 40.5 C 37 31.5 40.5 19.5 49 18 C 54.5 17 58.5 21.5 60 26.5 C 61.5 21.5 65.5 17 71 18 C 79.5 19.5 83 31.5 77.5 40.5 C 73.5 46.5 65.5 50.5 60 54 Z"/>

    <g id="clover-mark">
      <use href="#lf"/>
      <use href="#lf" transform="rotate(120 60 54)"/>
      <use href="#lf" transform="rotate(240 60 54)"/>
      <circle cx="60" cy="54" r="3.6"/>
    </g>

    <!-- doppia fascia e gambo: per le misure grandi (da 64px in su) -->
    <symbol id="sym-shamrock" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
        <g id="sh-leaf">
          <use href="#lf" stroke-width="2.9"/>
          <use href="#lf" transform="translate(60 36) scale(.7) translate(-60 -36)" stroke-width="1.9" opacity=".6"/>
        </g>
        <use href="#sh-leaf" transform="rotate(120 60 54)"/>
        <use href="#sh-leaf" transform="rotate(240 60 54)"/>
        <circle cx="60" cy="54" r="4" stroke-width="2.9"/>
        <path d="M60 58 C 61.5 74 59 90 50 99" stroke-width="2.6"/>
      </g>
    </symbol>

    <!-- essenziale, senza gambo: filetti e ornamenti piccoli -->
    <symbol id="sym-clover" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 6)">
        <use href="#clover-mark"/>
      </g>
    </symbol>

    <!-- tralcio con tre trifogli: decoro d'angolo, si specchia con scaleX(-1) -->
    <symbol id="sym-sprig" viewBox="0 0 150 92">
      <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
        <path d="M4 84 C 28 82 48 70 63 54 C 76 40 94 31 111 27" stroke-width="1.8"/>
        <path d="M55 62 C 54 52 55 44 57 38" stroke-width="1.4"/>
        <use href="#clover-mark" transform="translate(57 27) scale(.235) translate(-60 -54)" stroke-width="7"/>
        <use href="#clover-mark" transform="translate(122 20) scale(.16) translate(-60 -54)" stroke-width="10"/>
        <path d="M22 78 C 20 72 19 68 19 64" stroke-width="1.4"/>
        <use href="#clover-mark" transform="translate(19 57) scale(.13) translate(-60 -54)" stroke-width="12"/>
        <path d="M38 74 C 34 66 36 58 43 55 C 45 62 44 70 38 74 Z" stroke-width="1.4"/>
        <path d="M78 46 C 84 44 91 46 94 51 C 87 54 80 52 78 46 Z" stroke-width="1.4"/>
      </g>
    </symbol>

    <symbol id="flw-ivy" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 96 C 50 74 46 58 34 44" stroke-width="1.8"/>
        <path d="M50 70 C 58 62 66 58 74 58" stroke-width="1.8"/>
        <g id="ivy-leaf">
          <path d="M50 12 C 57 19 66 17 68 25 C 70 34 60 36 57 43 C 55 49 50 54 50 54 C 50 54 45 49 43 43 C 40 36 30 34 32 25 C 34 17 43 19 50 12 Z"/>
          <path d="M50 54 L 50 30" stroke-width="1.2"/>
        </g>
        <use href="#ivy-leaf" transform="translate(-24 30) scale(.62)"/>
        <use href="#ivy-leaf" transform="translate(40 34) scale(.55)"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- ============================ INVITO ============================ -->
<main class="invito" data-region="invito" aria-busy="true" aria-live="polite">
  <!-- il contenuto viene costruito da js/invito/main.js -->

    <svg class="invito__loading-crest" viewBox="0 0 120 120" aria-hidden="true"><use href="#sym-triquetra"/></svg>
    <p>Apriamo il vostro invito…</p>
  </div>
</main>

<div class="plait" aria-hidden="true"></div>

<!-- ============================ PIEDE ============================ -->
<footer class="site-footer">
  <div class="wrap">
    <svg class="site-footer__crest" viewBox="0 0 120 120" aria-hidden="true"><use href="#sym-claddagh"/></svg>
    <p class="blessing">Go maire sibh bhur saol nua</p>
    <p class="blessing__translation">Che possiate godervi la vostra vita nuova — il brindisi che in Irlanda si fa agli sposi</p>
    <p class="site-footer__signature">David &amp; Samantha</p>
  </div>
</footer>

<script type="module" src="js/invito/main.js"></script>
</body>
</html>
